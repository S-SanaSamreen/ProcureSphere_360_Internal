<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set up MFA - ProcureSphere 360 ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">
<div class="container"><div class="row justify-content-center"><div class="col-md-7 col-lg-5">
<div class="card shadow-lg border-0 rounded-4"><div class="card-body p-4 p-md-5 bg-white">
<h4 class="fw-bold mb-3">Set up two-factor authentication</h4>
<p class="small text-muted">Add this account to an authenticator app (use the otpauth link or enter the key manually), then enter the 6-digit code to confirm.</p>
<p class="small mb-1">Secret key</p>
<code class="d-block mb-2 user-select-all">{{ secret }}</code>
<p class="small mb-1">otpauth URI</p>
<code class="d-block mb-3 small text-break user-select-all">{{ otpauth_uri }}</code>
{% if error %}<div class="alert alert-danger small">{{ error }}</div>{% endif %}
<form method="post" autocomplete="off">{% csrf_token %}
<input class="form-control mb-3" name="code" inputmode="numeric" required maxlength="6" placeholder="123456">
<button class="btn btn-primary w-100" type="submit">Enable MFA</button>
</form>
</div></div></div></div></div>
</body>
</html>
