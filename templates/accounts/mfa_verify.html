<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify sign-in - ProcureSphere 360 ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">
<div class="container"><div class="row justify-content-center"><div class="col-md-7 col-lg-5">
<div class="card shadow-lg border-0 rounded-4"><div class="card-body p-4 p-md-5 bg-white">
<h4 class="fw-bold mb-3">Two-factor verification</h4>
<p class="small text-muted">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
{% if error %}<div class="alert alert-danger small">{{ error }}</div>{% endif %}
<form method="post" autocomplete="off">{% csrf_token %}
<input type="hidden" name="next" value="{{ request.GET.next }}">
<input class="form-control mb-3" name="code" inputmode="numeric" autofocus required maxlength="20" placeholder="123456">
<button class="btn btn-primary w-100" type="submit">Verify</button>
</form>
<a class="small d-block mt-3" href="/logout/">Cancel and sign out</a>
</div></div></div></div></div>
</body>
</html>
