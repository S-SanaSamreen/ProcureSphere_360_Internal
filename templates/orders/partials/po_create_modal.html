<div class="modal-header border-bottom border-secondary">
    <h5 class="modal-title text-dark fw-bold">
        <i class="fa-solid fa-cart-shopping text-cyan me-2"></i> Execute Purchase Order (PO)
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form method="POST" action="/purchase-orders/create/" id="po-create-form">
    {% csrf_token %}
    <div class="modal-body p-4">
        <div class="mb-3">
            <label class="form-label text-dark fw-semibold small" for="po-requisition">Approved Source Requisition (Optional)</label>
            <select name="requisition_id" id="po-requisition" class="form-select">
                <option value="" data-cc="">No requisition (direct purchase)</option>
                {% for pr in requisitions %}
                    <option value="{{ pr.id }}" data-cc="{{ pr.cost_center_id }}">{{ pr.pr_number }} — {{ pr.title }} · {{ pr.cost_center.code }} · up to ${{ pr.remaining_amount|floatformat:"2g" }} still orderable</option>
                {% endfor %}
            </select>
            <div class="form-text" id="po-cc-note" hidden>The cost center follows the requisition, so the PO commits against the budget that was reserved for it.</div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small" for="po-vendor">Awarded Vendor *</label>
                <select name="vendor_id" id="po-vendor" class="form-select" required>
                    <option value="">Select Active Vendor...</option>
                    {% for vendor in vendors %}
                        <option value="{{ vendor.id }}">{{ vendor.legal_name }} ({{ vendor.vendor_number }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small" for="po-cost-center">Cost Center *</label>
                <select name="cost_center_id" id="po-cost-center" class="form-select" required>
                    <option value="">Select Cost Center...</option>
                    {% for cc in cost_centers %}
                        <option value="{{ cc.id }}">{{ cc.code }} — {{ cc.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <h6 class="fw-bold text-dark mt-4 mb-2 small text-uppercase" style="letter-spacing: 0.05em;">
            <i class="fa-solid fa-list-check text-primary me-1"></i> Order Line Items
        </h6>
        <div id="po-lines" class="mb-2">
            <div class="po-line row g-2 align-items-end p-2 bg-light rounded-3 border mb-2">
                <div class="col-md-5">
                    <label class="form-label text-muted small mb-1">Item Description</label>
                    <input type="text" name="item_name" class="form-control form-control-sm" placeholder="e.g. HPE ProLiant DL380 Gen11 Server" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small mb-1">Quantity</label>
                    <input type="number" name="quantity" class="form-control form-control-sm po-qty" value="1" min="0.01" step="0.01" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small mb-1">UoM</label>
                    <input type="text" name="unit_of_measure" class="form-control form-control-sm" value="EA" maxlength="20">
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small mb-1">Unit Price ($)</label>
                    <input type="number" name="unit_price" class="form-control form-control-sm po-price" placeholder="12500.00" min="0" step="0.01" required>
                </div>
                <div class="col-md-1 text-end">
                    <button type="button" class="btn btn-sm btn-outline-danger po-remove-line" title="Remove line" aria-label="Remove line" hidden><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
        </div>
        <button type="button" class="btn btn-sm btn-outline-primary rounded-pill mb-3" id="po-add-line"><i class="fa-solid fa-plus me-1"></i>Add line</button>

        <div class="row g-3 mb-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label text-dark fw-semibold small" for="po-tax-pct">Tax rate (%)</label>
                <input type="number" name="tax_rate_pct" id="po-tax-pct" class="form-control form-control-sm" value="{{ default_tax_pct }}" min="0" max="100" step="0.01">
            </div>
            <div class="col-md-8 text-md-end small text-muted" id="po-totals" aria-live="polite">
                Subtotal $0.00 · Tax $0.00 · <span class="fw-bold text-dark">Total $0.00</span>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label text-dark fw-semibold small" for="po-terms">Terms &amp; Conditions</label>
            <textarea name="terms_and_conditions" id="po-terms" class="form-control" rows="2">Standard HPE Enterprise Procurement Terms &amp; Conditions (FOB Destination, Net 30)</textarea>
        </div>
    </div>

    <div class="modal-footer border-top border-secondary">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-cyan rounded-pill px-4 fw-bold shadow-sm">
            <i class="fa-solid fa-plus me-1"></i> Issue Purchase Order
        </button>
    </div>
</form>

<script>
(function () {
    var form = document.getElementById('po-create-form');
    if (!form) { return; }
    var lines = form.querySelector('#po-lines');
    var requisition = form.querySelector('#po-requisition');
    var costCenter = form.querySelector('#po-cost-center');
    var note = form.querySelector('#po-cc-note');
    var taxInput = form.querySelector('#po-tax-pct');
    var totals = form.querySelector('#po-totals');
    var template = lines.querySelector('.po-line').cloneNode(true);

    function money(n) { return '$' + n.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

    function refresh() {
        var rows = lines.querySelectorAll('.po-line');
        var subtotal = 0;
        rows.forEach(function (row) {
            var q = parseFloat(row.querySelector('.po-qty').value) || 0;
            var p = parseFloat(row.querySelector('.po-price').value) || 0;
            subtotal += q * p;
            row.querySelector('.po-remove-line').hidden = rows.length < 2;
        });
        var tax = subtotal * ((parseFloat(taxInput.value) || 0) / 100);
        totals.innerHTML = 'Subtotal ' + money(subtotal) + ' · Tax ' + money(tax) +
            ' · <span class="fw-bold text-dark">Total ' + money(subtotal + tax) + '</span>';
    }

    function syncRequisition() {
        var ccId = requisition.options[requisition.selectedIndex].getAttribute('data-cc');
        if (ccId) {
            costCenter.value = ccId;
            costCenter.style.pointerEvents = 'none';
            costCenter.classList.add('bg-light');
            note.hidden = false;
        } else {
            costCenter.style.pointerEvents = '';
            costCenter.classList.remove('bg-light');
            note.hidden = true;
        }
    }

    document.getElementById('po-add-line').addEventListener('click', function () {
        var row = template.cloneNode(true);
        row.querySelectorAll('input').forEach(function (el) {
            if (el.name === 'quantity') { el.value = '1'; }
            else if (el.name === 'unit_of_measure') { el.value = 'EA'; }
            else { el.value = ''; }
        });
        lines.appendChild(row);
        refresh();
        row.querySelector('input[name="item_name"]').focus();
    });
    lines.addEventListener('click', function (e) {
        var btn = e.target.closest('.po-remove-line');
        if (btn && lines.querySelectorAll('.po-line').length > 1) {
            btn.closest('.po-line').remove();
            refresh();
        }
    });
    lines.addEventListener('input', refresh);
    taxInput.addEventListener('input', refresh);
    requisition.addEventListener('change', syncRequisition);
    refresh();
})();
</script>
